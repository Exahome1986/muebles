name: Deploy index.html

on:
  workflow_dispatch:
    inputs:
      file_content:
        description: 'Base64 encoded index.html'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}

      - name: Write index.html
        run: echo "${{ github.event.inputs.file_content }}" | base64 -d > index.html

      - name: Commit and push
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy@exahome.app"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html"
          git push
