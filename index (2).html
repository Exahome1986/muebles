function ArchivedView({store, setStore}) {
  var R = React.createElement;
  // Today = Oct 2026 → archived = mes_vto < "2026-10" OR already paid (pago_inicial=true and !pendiente)
  var hoy = "2026-10";

  function isPago(id) {
    var stored = store["pago_" + id];
    if (stored !== undefined) return stored;
    var cam = CAMIONES_FULL.find(function(c){ return c.id === id; });
    return cam ? cam.pago_inicial || false : false;
  }

  // CAMIONES archivados: pendiente=false AND (mes_vto < hoy OR pago ok)
  var camsArchivados = CAMIONES_FULL.filter(function(c) {
    if (c.pendiente) return false; // still pending = not archived
    if (!c.mes_vto || c.mes_vto === "") return false;
    return c.mes_vto < hoy || isPago(c.id);
  });

  // Group by empresa
  var byEmp = {};
  camsArchivados.forEach(function(c) {
